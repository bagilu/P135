<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P135 翻轉新聞 FlipNews</title>
  <link rel="stylesheet" href="css/style.css?v=v3.3.1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-theme">
  <!-- 頂部導航列 -->
  <header class="app-header">
    <div class="brand">
      <span class="badge">P135</span>
      <h1>翻轉新聞 FlipNews</h1>
    </div>
    <div class="user-status">
      <button id="btnOpenHistory" class="btn btn-secondary btn-sm">📚 歷史文章庫</button>
      <button id="btnNewArticle" class="btn btn-primary btn-sm">✏️ 開啟新解讀</button>
      <span id="userStatusText">檢查認證狀態...</span>
      <button id="authBtn" class="btn btn-sm">登入 / 註冊</button>
      <span class="version-tag">v3.3.1</span>
    </div>
  </header>

  <!-- 三欄工作台 -->
  <main class="workspace-container">
    <!-- 左欄：輸入區 -->
    <section class="panel panel-left">
      <h2>1. 新聞原文與來源</h2>
      <div class="form-group">
        <label for="newsTitle">新聞標題</label>
        <input type="text" id="newsTitle" placeholder="貼入新聞標題...">
      </div>
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="newsMedia">來源媒體</label>
          <input type="text" id="newsMedia" placeholder="例如：某報、某社">
        </div>
        <div class="form-group flex-1">
          <label for="newsDate">報導日期</label>
          <input type="date" id="newsDate">
        </div>
      </div>
      <div class="form-group">
        <label for="newsUrl">原文連結 (選填)</label>
        <input type="url" id="newsUrl" placeholder="https://...">
      </div>
      <div class="form-group flex-grow">
        <label for="newsContent">新聞內文全文</label>
        <textarea id="newsContent" placeholder="在此貼入新聞長文..."></textarea>
      </div>
      <div class="actions">
        <button id="btnStartAnalyze" class="btn btn-primary">⚡ 開始 AI 多維解讀</button>
      </div>
    </section>

    <!-- 中欄：解讀對照區 -->
    <section class="panel panel-center">
      <h2>2. 多維度對照面板</h2>
      <div class="tab-header">
        <button class="tab-btn active" data-tab="tabNeutral">中性客觀改寫</button>
        <button class="tab-btn" data-tab="tabFlip">顏色/立場對調</button>
        <button class="tab-btn" data-tab="tabSentiment">情緒與用詞剖析</button>
        <button class="tab-btn" data-tab="tabFactOpinion">事實 vs. 觀點</button>
      </div>

      <div class="tab-content active" id="tabNeutral">
        <div class="diff-box" id="neutralContentBox">
          <p class="placeholder-text">點擊「開始解讀」後產生客觀中性版本...</p>
        </div>
      </div>

      <div class="tab-content" id="tabFlip">
        <div class="diff-box" id="flippedContentBox">
          <p class="placeholder-text">立場對調版本將在此呈現...</p>
        </div>
      </div>

      <div class="tab-content" id="tabSentiment">
        <div id="sentimentAnalysisBox">
          <p class="placeholder-text">煽動指數與情緒修飾字眼分析...</p>
        </div>
      </div>

      <div class="tab-content" id="tabFactOpinion">
        <div class="fact-opinion-grid">
          <div class="fact-col">
            <h3>📌 客觀事實清單 (Facts)</h3>
            <ul id="factsList"></ul>
          </div>
          <div class="opinion-col">
            <h3>💭 主觀觀點與評論 (Opinions)</h3>
            <ul id="opinionsList"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- 右欄：個人研判與履歷存檔 -->
    <section class="panel panel-right">
      <h2>3. 我的研判與事蹟存檔</h2>
      <div class="form-group">
        <label for="personalNotes">我的研判 / 動機推演 / 陰謀論</label>
        <textarea id="personalNotes" placeholder="誰在此時得利？為何這個時間點爆出？背後博弈邏輯..."></textarea>
      </div>

      <div class="dossier-tool">
        <h3>標記人物/組織事蹟 (懶人包)</h3>
        <div class="form-group">
          <input type="text" id="entityName" placeholder="實體名稱 (如：某政治人物、某部會)">
        </div>
        <div class="form-row">
          <select id="entityType" class="flex-1">
            <option value="person">政治人物</option>
            <option value="party">政黨</option>
            <option value="organization">政府/媒體組織</option>
          </select>
          <select id="eventType" class="flex-1">
            <option value="negative">負向 / 爭議言行</option>
            <option value="positive">正向政績</option>
            <option value="controversy">立場轉彎 / 跳票</option>
          </select>
        </div>
        <div class="form-group">
          <input type="text" id="eventTitle" placeholder="事蹟一句話簡述">
        </div>
        <button id="btnAddEvent" class="btn btn-secondary">＋ 存入個人懶人包庫</button>
      </div>

      <div class="actions">
        <button id="btnSaveAll" class="btn btn-success">💾 儲存本篇完整解讀</button>
      </div>
    </section>
  </main>

  <!-- 歷史清單側邊欄抽屜 (Drawer) -->
  <aside id="historyDrawer" class="history-drawer">
    <div class="drawer-header">
      <h3>📚 歷史解讀文章庫</h3>
      <button id="btnCloseDrawer" class="btn-close">&times;</button>
    </div>
    <div class="drawer-body">
      <ul id="historyList" class="history-list">
        <li class="loading-text">載入中...</li>
      </ul>
    </div>
  </aside>
  <div id="drawerOverlay" class="drawer-overlay"></div>

  <script src="config.js?v=v3.3.1"></script>
  <script src="js/supabase-client.js?v=v3.3.1"></script>
  <script src="js/app.js?v=v3.3.1"></script>
</body>
</html>
