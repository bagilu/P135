<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P135 翻轉新聞 FlipNews</title>
  <link rel="stylesheet" href="css/style.css?v=V0.0003">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-theme">
  <!-- 頂部導航列 -->
  <header class="app-header">
    <div class="brand">
      <span class="badge">P135</span>
      <h1>翻轉新聞 FlipNews</h1>
    </div>
    <div class="user-status">
      <button id="btnOpenHistory" class="btn btn-secondary btn-sm">📚 歷史文章庫</button>
      <span id="userStatusText">檢查認證狀態...</span>
      <button id="authBtn" class="btn btn-sm">登入 / 註冊</button>
      <span id="appVersionTag" class="version-tag">V0.0003</span>
    </div>
  </header>

  <!-- 三欄工作台 -->
  <main class="workspace-container">
    <!-- 【左欄：循序操作 1 -> 2 -> 3】 -->
    <section class="panel panel-left">
      <!-- 步驟 1: 開啟新解讀 -->
      <div class="step-box step-box-top">
        <button id="btnNewArticle" class="btn btn-primary btn-block">✏️ (1) 開啟新解讀</button>
      </div>

      <!-- 步驟 2: 抓取填入 (支援自由、聯合、中時、三立外部超連結) -->
      <div class="step-box">
        <label for="autoNewsUrl" class="step-label">
          🔗 (2) 貼入新聞網址自動抓取 (
          <a href="https://www.ltn.com.tw" target="_blank" rel="noopener noreferrer" class="media-link">自由</a> / 
          <a href="https://udn.com/" target="_blank" rel="noopener noreferrer" class="media-link">聯合</a> / 
          <a href="https://www.chinatimes.com" target="_blank" rel="noopener noreferrer" class="media-link">中時</a> / 
          <a href="https://www.setn.com/catalog/politics" target="_blank" rel="noopener noreferrer" class="media-link">三立</a>
          )
        </label>
        <div class="input-with-button">
          <input type="url" id="autoNewsUrl" placeholder="https://news.ltn.com.tw/... 或 https://udn.com/...">
          <button id="btnFetchUrl" class="btn btn-secondary btn-sm">抓取填入</button>
        </div>
      </div>

      <!-- 新聞資料與全文輸入區 -->
      <div class="form-group">
        <label for="newsTitle">新聞標題</label>
        <input type="text" id="newsTitle" placeholder="貼入或抓取之新聞標題...">
      </div>
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="newsMedia">來源媒體</label>
          <input type="text" id="newsMedia" placeholder="例如：自由時報、聯合報、三立新聞">
        </div>
        <div class="form-group flex-1">
          <label for="newsDate">報導日期</label>
          <input type="date" id="newsDate">
        </div>
      </div>
      <div class="form-group">
        <label for="newsUrl">原文連結 (選填)</label>
        <input type="url" id="newsUrl" placeholder="https://...">
      </div>
      <div class="form-group flex-grow">
        <label for="newsContent">新聞內文全文</label>
        <textarea id="newsContent" placeholder="在此檢閱或貼入新聞長文..."></textarea>
      </div>

      <!-- 步驟 3: 進行 AI 多維解讀 -->
      <div class="actions">
        <button id="btnStartAnalyze" class="btn btn-primary btn-block">⚡ (3) 進行 AI 多維解讀</button>
      </div>
    </section>

    <!-- 【中欄：多維度對照面板】 -->
    <section class="panel panel-center">
      <h2>多維度對照面板</h2>
      <div class="tab-header">
        <button class="tab-btn active" data-tab="tabNeutral">中性客觀改寫</button>
        <button class="tab-btn" data-tab="tabFlip">顏色/立場對調</button>
        <button class="tab-btn" data-tab="tabSentiment">情緒與用詞剖析</button>
        <button class="tab-btn" data-tab="tabFactOpinion">事實 vs. 觀點</button>
      </div>

      <div class="tab-content active" id="tabNeutral">
        <div class="diff-box" id="neutralContentBox">
          <p class="placeholder-text">完成步驟 (3) 解讀後，此處產生客觀中性版本...</p>
        </div>
      </div>

      <div class="tab-content" id="tabFlip">
        <div class="diff-box" id="flippedContentBox">
          <p class="placeholder-text">立場對調版本將在此呈現...</p>
        </div>
      </div>

      <div class="tab-content" id="tabSentiment">
        <div id="sentimentAnalysisBox">
          <p class="placeholder-text">煽動指數與情緒修飾字眼分析...</p>
        </div>
      </div>

      <div class="tab-content" id="tabFactOpinion">
        <div class="fact-opinion-grid">
          <div class="fact-col">
            <h3>📌 客觀事實清單 (Facts)</h3>
            <ul id="factsList"></ul>
          </div>
          <div class="opinion-col">
            <h3>💭 主觀觀點與評論 (Opinions)</h3>
            <ul id="opinionsList"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- 【右欄：個人研判與事蹟存檔】 -->
    <section class="panel panel-right">
      <h2>個人研判與事蹟存檔</h2>
      <div class="form-group">
        <label for="personalNotes">我的研判 / 動機推演 / 陰謀論</label>
        <textarea id="personalNotes" placeholder="誰在此時得利？為何這個時間點爆出？背後博弈邏輯..."></textarea>
      </div>

      <div class="dossier-tool">
        <h3>標記人物/組織事蹟 (懶人包)</h3>
        <div class="form-group">
          <input type="text" id="entityName" placeholder="實體名稱 (如：某政治人物、某部會)">
        </div>
        <div class="form-row">
          <select id="entityType" class="flex-1">
            <option value="person">政治人物</option>
            <option value="party">政黨</option>
            <option value="organization">政府/媒體組織</option>
          </select>
          <select id="eventType" class="flex-1">
            <option value="negative">負向 / 爭議言行</option>
            <option value="positive">正向政績</option>
            <option value="controversy">立場轉彎 / 跳票</option>
          </select>
        </div>
        <div class="form-group">
          <input type="text" id="eventTitle" placeholder="事蹟一句話簡述">
        </div>
        <button id="btnAddEvent" class="btn btn-secondary">＋ 存入個人懶人包庫</button>
      </div>

      <!-- 步驟 4: 儲存本篇完整解讀 -->
      <div class="actions">
        <button id="btnSaveAll" class="btn btn-success btn-block">💾 (4) 儲存本篇完整解讀</button>
      </div>
    </section>
  </main>

  <!-- 歷史文章庫抽屜 -->
  <aside id="historyDrawer" class="history-drawer">
    <div class="drawer-header">
      <h3>📚 歷史解讀文章庫</h3>
      <button id="btnCloseDrawer" class="btn-close">&times;</button>
    </div>
    <div class="drawer-body">
      <ul id="historyList" class="history-list">
        <li class="loading-text">載入中...</li>
      </ul>
    </div>
  </aside>
  <div id="drawerOverlay" class="drawer-overlay"></div>

  <!-- 快取更新：帶入 V0.0003 -->
  <script src="config.js?v=V0.0003"></script>
  <script src="js/supabase-client.js?v=V0.0003"></script>
  <script src="js/app.js?v=V0.0003"></script>
</body>
</html>
